<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="estilos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>


    <h1>Formulario de pruebas</h1>
    <div>
        <form action="/usuario/nombre" method="post">
            <input type="string" name="nombre" id="nombre" required>
            <input type="submit" value="leerUsuario">
        </form>
    </div>
    <h1>Formulario</h1>

    <div>
        <form action="/usuarios" method="get">
        <input type="submit" value="leer">
        </form>
    </div>







    <form action="/crearUsuario" method="post">
        <label for="nombre">Nombre: </label>
        <input type="text" name="nombre" id="nombre" required><br>
        <label for="email">Correo: </label>
        <input type="text" name="email" id="email" required><br>
        <label for="password">Contraseña: </label>
        <input type="password" name="password" id="password" required><br>
        <input type="submit" value="Registrarse">
    </form>
    <h2>Formulario de actualizacion por nombre</h2>
    <form action="/usuario/actualizacionNombre" method="post">
        <label for="nombre">Nombre de Busqueda: </label>            
        <input type="string" id="nombre" name="nombre" required><br>
        <label for="nuevonombre">Nombre actualizado: </label> 
        <input type="string" id="nuevonombre" name="nuevonombre" required><br>
        <label for="nuevoemail">Correo actualizado: </label> 
        <input type="string" id="nuevoemail" name="nuevoemail" required><br>
        <label for="nuevopassword">Contraseña actualizada: </label>
        <input type="password" id="nuevopassword" name="nuevopassword" required>
        <input type="submit" value="ActualizarUsuario">  
    </form>
    <h2>Eliminar usuario por nombre</h2>
    <form action="/usuario/eliminar" method="post">
        <input type="string" id="nombre" name="nombre" required>
        <input type="submit" value="Eliminar">
    </form>


</body>
</html>
